<title>Qsy – Kiosco escolar</title>
<style>
:root{--bg:#f4f3ee;--card:#fff;--ink:#17160f;--mute:#6b6a60;--acc:#f9db36;--accink:#17160f;--bot:#fff;--me:#f9db36;--line:#dedcd0;--ok:#2f7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15150f;--card:#22221a;--ink:#f4f3ee;--mute:#a3a296;--bot:#22221a;--line:#38372c;--ok:#6fd096}}
:root[data-theme="dark"]{--bg:#15150f;--card:#22221a;--ink:#f4f3ee;--mute:#a3a296;--bot:#22221a;--line:#38372c;--ok:#6fd096}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{background:var(--acc);color:var(--accink);padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:19px;letter-spacing:.2px}
.logo{width:46px;height:46px;border-radius:50%;flex:none;background:#fff}
header span{font-size:13px;opacity:.75}
#cartbtn{margin-left:auto;background:var(--accink);color:var(--acc);border:0;border-radius:20px;padding:7px 13px;font-weight:600;font-size:14px}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.me{background:var(--me);color:var(--accink);border-bottom-right-radius:4px;align-self:flex-end}
.opts{display:flex;flex-wrap:wrap;gap:7px;align-self:flex-start;max-width:96%}
.opts button,.item button{font:inherit}
.opt{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:500}
.opt:active{background:var(--acc);color:var(--accink)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;align-self:stretch}
.item .t{flex:1}
.item .t small{display:block;color:var(--mute);font-size:13px}
.item .p{font-weight:600;white-space:nowrap}
.add{background:var(--acc);color:var(--accink);border:0;border-radius:50%;width:34px;height:34px;font-size:20px;font-weight:700;line-height:1}
.ok{color:var(--ok);font-weight:600}
form#f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
#in{flex:1;font:inherit;padding:10px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
#send{background:var(--ink);color:var(--bg);border:0;border-radius:20px;padding:0 16px;font:inherit;font-weight:600}
:focus-visible{outline:3px solid #2b6fd6;outline-offset:2px}
</style>
</head>

n><button id="cartbtn" onclick="showCart()">🛒 <span id="cc">0</span> · $<span id="ct">0</span></button></header>
<div id="chat" aria-live="polite"></div>
<form id="f" onsubmit="return typed(event)"><input id="in" placeholder="Escribime lo que necesites…" autocomplete="off"><button id="send">Enviar</button></form>
</div>
<script>
// ====== EDITÁ ACÁ ======
const WHATSAPP_KIOSCO = "5492610000000"; // número del kiosquero (con código de país, sin +)
const RECREOS = ["1.er recreo (9:40)","2.º recreo (11:20)","Almuerzo (12:30)"];
const ALIAS_MP = "kiosco.qsy";        // alias de Mercado Pago del kiosco (reemplazar)
const TITULAR = "Nombre del titular";  // titular de la cuenta (reemplazar)
const MENU = {
  "Menú saludable 🌱": [
    {n:"Sándwich integral de pollo", d:"Pan integral o de semillas, pollo desmenuzado, tomate o lechuga", p:2600},
    {n:"Sándwich integral de queso magro", d:"Pan integral o de semillas, queso magro, tomate o lechuga", p:2300},
    {n:"Pizzeta integral", d:"Salsa de tomate natural y muzzarella moderada", p:1800},
    {n:"Muffin salado de verdura y avena", d:"Zapallito, acelga o choclo", p:1500},
    {n:"Frutos secos y semillas", d:"Porción individual, semillas tostadas", p:1200},
    {n:"Budín casero", d:"Harina integral, avena, azúcar mascabo o stevia y frutas", p:1400},
    {n:"Barrita casera", d:"Avena y frutas, sin azúcar refinada", p:1000},
    {n:"Galletitas de avena y cacao", d:"Caseras", p:900},
    {n:"Brochetas de frutas", d:"Fruta de estación", p:1500},
    {n:"Yogur con granola", d:"Bebible o firme", p:1600}
  ],
  "Combos 🎉": [
    {n:"Combo Energía del Recreo", d:"Sándwich integral + agua saborizada sin azúcares agregados", p:3300},
    {n:"Combo Dulce Saludable", d:"Licuado natural en botellita + muffin de arándanos o barrita casera", p:3000},
    {n:"Combo Frutal", d:"Yogur bebible + brocheta o porción de frutas de estación", p:2700}
  ],
  "Bebidas 💧": [
    {n:"Agua mineral", d:"Sola", p:900},
    {n:"Jugo 100% de fruta", d:"", p:1300}
  ],
  "Clásicos del recreo 🍫": [
    {n:"Alfajor", d:"El rey del recreo", p:800},
    {n:"Paquete de galletas", d:"Dulces o saladas, porción individual", p:700},
    {n:"Bizcochitos", d:"", p:700},
    {n:"Pochoclos", d:"", p:600}
  ]
};
// =======================
let cart = {}, state = "menu", order = {};
const chat = document.getElementById("chat");
const $ = id => document.getElementById(id);
const money = n => n.toLocaleString("es-AR");

function say(t, who="bot"){const d=document.createElement("div");d.className="m "+who;d.textContent=t;chat.appendChild(d);scroll();}
function scroll(){chat.scrollTop=chat.scrollHeight;}
function options(list){
  const w=document.createElement("div");w.className="opts";
  list.forEach(([label,fn])=>{const b=document.createElement("button");b.className="opt";b.textContent=label;
    b.onclick=()=>{w.remove();say(label,"me");fn();};w.appendChild(b);});
  chat.appendChild(w);scroll();
}
function total(){return Object.values(cart).reduce((s,i)=>s+i.p*i.q,0);}
function count(){return Object.values(cart).reduce((s,i)=>s+i.q,0);}
function refresh(){$("cc").textContent=count();$("ct").textContent=money(total());}

function mainMenu(){
  state="menu";
  say("¿Qué te gustaría pedir hoy? Elegí lo que más se te antoje 👇");
  options([...Object.keys(MENU).map(c=>[c,()=>category(c)]),["Ver mi pedido 🛒",showCart]]);
}
function category(c){
  say("¡Mirá lo que tenemos! 😋 Tocá el + para agregar lo que quieras:");
  MENU[c].forEach(it=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML='<div class="t"></div><div class="p"></div><button class="add" aria-label="Agregar"></button>';
    d.querySelector(".t").innerHTML="<b></b><small></small>";
    d.querySelector("b").textContent=it.n;d.querySelector("small").textContent=it.d;
    d.querySelector(".p").textContent="$"+money(it.p);
    const b=d.querySelector(".add");b.textContent="+";
    b.onclick=()=>{cart[it.n]=cart[it.n]||{p:it.p,q:0};cart[it.n].q++;refresh();b.textContent="✓";setTimeout(()=>b.textContent="+",600);};
    chat.appendChild(d);
  });
  scroll();
  options([["Quiero ver más opciones",mainMenu],["Ver mi pedido 🛒",showCart]]);
}
function cartText(){
  return Object.entries(cart).map(([n,i])=>`• ${i.q} × ${n} — $${money(i.p*i.q)}`).join("\n")+`\n\nTotal: $${money(total())}`;
}
function showCart(){
  if(!count()){say("Todavía no agregaste nada, ¡pero no pasa nada! Elegí lo que te guste del menú 😊");return mainMenu();}
  say("Así va tu pedido, ¡se ve riquísimo! 😋\n\n"+cartText());
  options([["Sí, confirmar pedido ✅",askName],["Quiero agregar algo más",mainMenu],["Prefiero empezar de nuevo",()=>{cart={};refresh();say("Listo, vacié tu pedido. Cuando quieras, empezamos de nuevo 😊");mainMenu();}]]);
}
function askName(){state="name";say("¡Genial! Para que el kiosquero te lo prepare con cariño, ¿me contás tu nombre y tu curso? Por ejemplo: Valentina, 3.º B 😊");}
function askRecreo(){
  state="menu";say("¿En qué recreo pasás a retirarlo?");
  options(RECREOS.map(r=>[r,()=>{order.recreo=r;askPago();}]));
}
function askPago(){
  say("¡Ya casi terminamos! ¿Cómo te queda más cómodo pagar?");
  options([["💵 Efectivo al retirar",()=>{order.pago="Efectivo (al retirar)";finish();}],
           ["📱 Billetera virtual (Mercado Pago)",()=>{order.pago="Billetera virtual / Mercado Pago";finish();}]]);
}
function finish(){
  const num=Math.floor(100+Math.random()*900), tot=total(), bill=order.pago.startsWith("Billetera");
  const resumen=`Pedido #${num}\nAlumno: ${order.name}\nRetiro: ${order.recreo}\nPago: ${order.pago}\n\n${cartText()}`;
  say("¡Listo! Tu pedido quedó registrado ✅ Muchas gracias por elegirnos 💛\n\n"+resumen);
  if(bill) say(`Para pagar, podés transferir $${money(tot)} desde Mercado Pago u otra billetera a esta cuenta:\n\nAlias: ${ALIAS_MP}\nTitular: ${TITULAR}\n\nCuando termines, tocá el botón de abajo y mandanos el comprobante. ¡Gracias! 🙌`);
  else say(`Pagás $${money(tot)} en efectivo cuando pases a retirarlo. ¡Que lo disfrutes! 🍎`);
  const a=document.createElement("a");
  a.href="https://wa.me/"+WHATSAPP_KIOSCO+"?text="+encodeURIComponent(resumen+(bill?"\n\n(Adjunto comprobante de pago)":""));
  a.target="_blank";a.rel="noopener";a.className="opt";a.style.cssText="align-self:flex-start;text-decoration:none;background:#25d366;color:#04230f;border-color:#25d366";
  a.textContent=bill?"Enviar pedido y comprobante por WhatsApp":"Enviar pedido al kiosquero por WhatsApp";
  chat.appendChild(a);
  cart={};refresh();
  options([["Quiero hacer otro pedido",mainMenu]]);
}
function typed(e){
  e.preventDefault();
  const v=$("in").value.trim();if(!v)return false;
  $("in").value="";say(v,"me");
  if(state==="name"){order.name=v;say("¡Gracias, "+v+"! 😊");askRecreo();return false;}
  const t=v.toLowerCase();
  if(/menu|menú|carta|hola|buen/.test(t))mainMenu();
  else if(/salud|ensalada|fruta|yogur|muffin|pizzeta/.test(t))category("Menú saludable 🌱");
  else if(/combo/.test(t))category("Combos 🎉");
  else if(/bebida|jugo|agua|tomar/.test(t))category("Bebidas 💧");
  else if(/snack|golosina|alfajor|galleta|clásico|clasico|pochoclo/.test(t))category("Clásicos del recreo 🍫");
  else if(/pedido|carrito|total/.test(t))showCart();
  else{say("Uy, no te entendí bien 🙈 ¡perdoname! Podés escribirme: menú, saludable, combos, bebidas, clásicos o pedido, o tocar una opción.");mainMenu();}
  return false;
}
say("¡Hola! 😊 Soy Qsy, y estoy para ayudarte. Podés pedir tu comida antes del recreo y retirarla sin hacer fila, así disfrutás todo tu descanso.");
mainMenu();
</script>
